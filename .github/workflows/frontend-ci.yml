name: Frontend CI

on:
  push:
    paths:
      - 'frontend/**'
      - '.github/workflows/**'
    branches: [testing, main, develop]
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/**'
    branches: [testing, main, develop]
jobs:
  build:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          cd frontend
          npm install

      - name: Build check
        run: |
          cd frontend
          npm run build
