name: Frontend CI

on:
  push:
    paths:
      - 'frontend/**'
    branches: [main, develop, testing]
  pull_request:
    paths:
      - 'frontend/**'
    branches: [main, develop, testing] 
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          cd frontend
          npm install

      - name: Build check
        run: |
          cd frontend
          npm run build
