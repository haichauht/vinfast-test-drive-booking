name: Backend CI

on:
  push:
    paths:
      - 'backend/**'
      - '.github/workflows/**'
    branches: [testing, main, develop]
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/**'
    branches: [testing, main, develop]

jobs:
  test:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Lint with ruff
        run: ruff check backend/src/ backend/tests/

      - name: Static type checking with mypy
        run: mypy --ignore-missing-imports backend/src/

      - name: Security scanning with bandit
        run: bandit -r backend/src/ -ll --skip B104,B608

      - name: Run tests with coverage
        run: pytest backend/tests/ -v --tb=short --cov=backend/src/ --cov-report=term-missing
        env:
          APP_ENV: test
          OPENAI_API_KEY: test-key

      - name: Verify Docker build
        run: docker build -t backend-test ./backend

