name: Backend CI

on:
  push:
    paths:
      - 'backend/**'
      - 'eval/benchmarks/**'
      - 'eval/golden/**'
      - '.github/workflows/backend-ci.yml'
    branches: [main]
  pull_request:
    paths:
      - 'backend/**'
      - 'eval/benchmarks/**'
      - 'eval/golden/**'
      - '.github/workflows/backend-ci.yml'
    branches: [testing, develop, main]

jobs:
  test:
    runs-on: self-hosted
    steps:
      - name: Configure Git Buffer
        run: |
          git config --global http.postBuffer 524288000
          git config --global http.version HTTP/1.1

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install --retries 5 --default-timeout 100 -r backend/requirements.txt

      - name: Lint with ruff
        run: ruff check backend/src/ backend/tests/

      - name: Static type checking with mypy
        run: mypy --ignore-missing-imports backend/src/

      - name: Security scanning with bandit
        run: bandit -r backend/src/ -ll --skip B104,B608

      - name: Run deterministic guardrail benchmark
        run: >
          python backend/scripts/run_guardrail_benchmark.py
          --fail-under 1.0
          --verify-baseline eval/benchmarks/results/baseline.json
          --json-output artifacts/guardrail-benchmark/report.json
          --markdown-output artifacts/guardrail-benchmark/report.md
        env:
          APP_ENV: test

      - name: Upload guardrail benchmark report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: guardrail-benchmark-${{ github.sha }}
          path: artifacts/guardrail-benchmark/
          if-no-files-found: warn

      - name: Run tests with coverage
        run: |
          mkdir -p artifacts
          pytest backend/tests/ -v --tb=short --cov=backend/src/ --cov-report=term-missing --cov-report=json:artifacts/backend-coverage.json
        env:
          APP_ENV: test
          OPENAI_API_KEY: test-key

      - name: Build offline agent evaluation report
        run: >
          python backend/scripts/run_agent_evaluation.py
          --coverage-json artifacts/backend-coverage.json
          --json-output artifacts/agent-evaluation/report.json
          --markdown-output artifacts/agent-evaluation/report.md

      - name: Upload agent evaluation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-evaluation-${{ github.sha }}
          path: |
            artifacts/agent-evaluation/
            artifacts/backend-coverage.json
          if-no-files-found: warn

      - name: Verify Docker build
        run: docker build -t backend-test ./backend

  deploy:
    name: Deploy to Google Cloud Run
    needs: test
    if: github.event_name == 'push' && github.ref_name == 'main'
    runs-on: self-hosted

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      # Cloud Run giữ lại biến môi trường của lần deploy trước, nên thiếu bước này
      # service vẫn chạy nhưng APP_ENV rơi về "development". Khi đó bốn chốt chặn
      # trong Settings.require_production_otp_secret im lặng tắt hết, và các khoá ký
      # rơi về hằng số nằm sẵn trong repo. Chặn sớm ở đây để không deploy nhầm.
      - name: Verify required deployment secrets
        run: |
          missing=""
          [ -n "${{ secrets.BOOKING_ACCESS_OTP_SECRET }}" ] || missing="$missing BOOKING_ACCESS_OTP_SECRET"
          [ -n "${{ secrets.CONVERSATION_SIGNING_SECRET }}" ] || missing="$missing CONVERSATION_SIGNING_SECRET"
          if [ -n "$missing" ]; then
            echo "::error::Thieu GitHub secret:$missing"
            echo "Them cac secret nay trong Settings > Secrets and variables > Actions."
            echo "Moi khoa phai dai it nhat 32 ky tu, sinh bang: openssl rand -base64 48"
            exit 1
          fi

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy vinfast-backend \
            --source ./backend \
            --region asia-southeast1 \
            --allow-unauthenticated \
            --port 8000 \
            --memory 1Gi \
            --cpu 1 \
            --set-env-vars "APP_ENV=production" \
            --set-env-vars "BOOKING_ACCESS_OTP_SECRET=${{ secrets.BOOKING_ACCESS_OTP_SECRET }}" \
            --set-env-vars "CONVERSATION_SIGNING_SECRET=${{ secrets.CONVERSATION_SIGNING_SECRET }}"
