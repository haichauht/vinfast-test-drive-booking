name: Backend CI

on:
  push:
    paths:
      - 'backend/**'
      - 'eval/benchmarks/**'
      - 'eval/golden/**'
      - '.github/workflows/backend-ci.yml'
    branches: [testing, main, develop]
  pull_request:
    paths:
      - 'backend/**'
      - 'eval/benchmarks/**'
      - 'eval/golden/**'
      - '.github/workflows/backend-ci.yml'
    branches: [testing, main, develop]

jobs:
  test:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Lint with ruff
        run: ruff check backend/src/ backend/tests/

      - name: Static type checking with mypy
        run: mypy --ignore-missing-imports backend/src/

      - name: Security scanning with bandit
        run: bandit -r backend/src/ -ll --skip B104,B608

      - name: Run deterministic guardrail benchmark
        run: >
          python backend/scripts/run_guardrail_benchmark.py
          --fail-under 1.0
          --verify-baseline eval/benchmarks/results/baseline.json
          --json-output artifacts/guardrail-benchmark/report.json
          --markdown-output artifacts/guardrail-benchmark/report.md
        env:
          APP_ENV: test

      - name: Upload guardrail benchmark report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: guardrail-benchmark-${{ github.sha }}
          path: artifacts/guardrail-benchmark/
          if-no-files-found: warn

      - name: Run tests with coverage
        run: |
          mkdir -p artifacts
          pytest backend/tests/ -v --tb=short --cov=backend/src/ --cov-report=term-missing --cov-report=json:artifacts/backend-coverage.json
        env:
          APP_ENV: test
          OPENAI_API_KEY: test-key

      - name: Build offline agent evaluation report
        run: >
          python backend/scripts/run_agent_evaluation.py
          --coverage-json artifacts/backend-coverage.json
          --json-output artifacts/agent-evaluation/report.json
          --markdown-output artifacts/agent-evaluation/report.md

      - name: Upload agent evaluation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-evaluation-${{ github.sha }}
          path: |
            artifacts/agent-evaluation/
            artifacts/backend-coverage.json
          if-no-files-found: warn

      - name: Verify Docker build
        run: docker build -t backend-test ./backend

  deploy:
    name: Build image and deploy to Render
    needs: test
    if: github.event_name == 'push' && github.ref_name == 'main'
    runs-on: self-hosted
    env:
      IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/vinfastbooking-api

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Linux image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Trigger Render deploy
        uses: actions/github-script@v7
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        with:
          script: |
            const response = await fetch(process.env.RENDER_DEPLOY_HOOK_URL, { method: 'POST' });
            if (!response.ok) {
              core.setFailed(`Render deploy hook failed: ${response.status} ${await response.text()}`);
            }

