name: Backend CI

on:
  push:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
    branches: [main]
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
    branches: [testing, develop, main]

jobs:
  test:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Lint with ruff
        run: ruff check backend/src/ backend/tests/

      - name: Static type checking with mypy
        run: mypy --ignore-missing-imports backend/src/

      - name: Security scanning with bandit
        run: bandit -r backend/src/ -ll --skip B104,B608

      - name: Run tests with coverage
        run: pytest backend/tests/ -v --tb=short --cov=backend/src/ --cov-report=term-missing
        env:
          APP_ENV: test
          OPENAI_API_KEY: test-key

      - name: Verify Docker build
        run: docker build -t backend-test ./backend

  deploy:
    name: Build image and deploy to Render
    needs: test
    if: github.event_name == 'push' && github.ref_name == 'main'
    runs-on: self-hosted
    env:
      IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/vinfastbooking-api

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Linux image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Trigger Render deploy
        uses: actions/github-script@v7
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        with:
          script: |
            const response = await fetch(process.env.RENDER_DEPLOY_HOOK_URL, { method: 'POST' });
            if (!response.ok) {
              core.setFailed(`Render deploy hook failed: ${response.status} ${await response.text()}`);
            }
