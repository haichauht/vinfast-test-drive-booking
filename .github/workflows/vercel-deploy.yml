name: Deploy frontend to Vercel

on:
  push:
    branches:
      - main
      - testing
      - develop
      - "update/**"
    paths:
      - "frontend/**"
      - ".github/workflows/vercel-deploy.yml"

concurrency:
  group: vercel-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Pull Vercel production configuration
        if: github.ref_name == 'main'
        run: npx vercel@latest pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build production artifacts
        if: github.ref_name == 'main'
        run: npx vercel@latest build --prod --token="$VERCEL_TOKEN"

      - name: Deploy production
        if: github.ref_name == 'main'
        run: npx vercel@latest deploy --prebuilt --prod --token="$VERCEL_TOKEN"

      - name: Pull Vercel preview configuration
        if: github.ref_name != 'main'
        run: npx vercel@latest pull --yes --environment=preview --token="$VERCEL_TOKEN"

      - name: Build preview artifacts
        if: github.ref_name != 'main'
        run: npx vercel@latest build --token="$VERCEL_TOKEN"

      - name: Deploy preview
        if: github.ref_name != 'main'
        run: npx vercel@latest deploy --prebuilt --token="$VERCEL_TOKEN"
